name: NDK build

on:
  workflow_dispatch:
  pull_request:
  push:
    branches-ignore: ['version-*']

permissions:
  contents: read

jobs:
  test-local:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: seanmiddleditch/gha-setup-ninja@v5
      - name: Set up Clang
        uses: egor-tensin/setup-clang@v1
        with:
          version: latest
          platform: x64
      - uses: Fernthedev/qpm-action@v2
      - name: Run existing tests
        run: ./test.sh

  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: seanmiddleditch/gha-setup-ninja@v5
      - uses: Fernthedev/qpm-action@v2
      - name: Build package
        run: qpm2 qpkg --qmod
      - name: Name debug artifact
        run: cp build/debug/libflamingo.so build/debug_libflamingo.so
      - uses: actions/upload-artifact@v4
        with:
          name: flamingo
          path: |
            build/libflamingo.so
            build/debug_libflamingo.so
            flamingo.qmod
            flamingo.qpkg
          if-no-files-found: error
