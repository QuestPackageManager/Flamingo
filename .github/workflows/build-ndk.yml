name: NDK build

on:
  workflow_dispatch:
  pull_request:
  push:
    branches-ignore: ['version-*']

permissions:
  contents: read

jobs:
  test-local:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: seanmiddleditch/gha-setup-ninja@v5
      - uses: Fernthedev/qpm-action@v2
      - name: Install ARM64 test emulator
        run: sudo apt-get update && sudo apt-get install -y qemu-user
      - name: Run existing tests
        run: ./test.sh

  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: seanmiddleditch/gha-setup-ninja@v5
      - uses: Fernthedev/qpm-action@v2
      - name: Build package
        run: qpm2 qpkg --qmod
      - name: Verify packaged library
        run: |
          python3 -c "from pathlib import Path; from zipfile import ZipFile; binary = Path('build/libflamingo.so').read_bytes(); assert ZipFile('flamingo.qpkg').read('bin/libflamingo.so') == binary; assert ZipFile('flamingo.qmod').read('libflamingo.so') == binary"
      - name: Name debug artifact
        run: cp build/debug/libflamingo.so build/debug_libflamingo.so
      - uses: actions/upload-artifact@v4
        with:
          name: flamingo
          path: |
            build/libflamingo.so
            build/debug_libflamingo.so
            flamingo.qmod
            flamingo.qpkg
          if-no-files-found: error
