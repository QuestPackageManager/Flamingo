name: Android test build

on:
  workflow_dispatch:
  push:
    branches-ignore: ['version-*']
  pull_request:

permissions:
  contents: read

jobs:
  build-android-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: seanmiddleditch/gha-setup-ninja@v5
      - uses: Fernthedev/qpm-action@v2
      - name: Build existing Android test
        run: qpm2 s build-android-test
      - uses: actions/upload-artifact@v4
        with:
          name: flamingo-android-test
          path: |
            build/libflamingo.so
            build/debug/libflamingo.so
          if-no-files-found: error
